paths:
  /rides/{rideId}/rating:
    post:
      tags:
        - Ratings
      summary: Khách hàng đánh giá tài xế (Rate driver)
      description: Khách hàng chấm điểm (1-5 sao) và để lại bình luận về chất lượng chuyến đi sau khi đã hoàn tất.
      operationId: rateDriver
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/RatingRequest'
      responses:
        '201':
          description: Đánh giá đã được ghi nhận thành công.
