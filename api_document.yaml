openapi: 3.0.0

info:
  title: CAB System API
  description: |
    REST API cho hệ thống đặt xe trực tuyến (CAB System - MVP 7 tuần).

    Hỗ trợ:
      - Xác thực người dùng (Customer, Driver, Admin)
      - Đặt xe
      - Điều phối tài xế
      - Theo dõi chuyến đi
      - Thanh toán
      - Đánh giá tài xế
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server

tags:
  - name: Authentication
  - name: Rides
  - name: Drivers
  - name: Payments
  - name: Ratings

security:
  - BearerAuth: []

# --- PHÂN ĐIỀU HƯỚNG TỚI CÁC FILE API CON ---
paths:
  # Module Authentication
  /auth/register:
    $ref: './api/fr00_auth.yaml#/paths/~1auth~1register'
  /auth/login:
    $ref: './api/fr00_auth.yaml#/paths/~1auth~1login'

  # Module Rides (Khách hàng đặt xe)
  /rides:
    $ref: './api/fr01_booking.yaml#/paths/~1rides'
  /rides/{rideId}:
    $ref: './api/fr01_booking.yaml#/paths/~1rides~1{rideId}'
  /rides/{rideId}/cancel:
    $ref: './api/fr01_booking.yaml#/paths/~1rides~1{rideId}~1cancel'

  # Module Dispatch & Tracking (Khớp chuyến & Theo dõi)
  /rides/{rideId}/tracking:
    $ref: './api/fr03_tracking.yaml#/paths/~1rides~1{rideId}~1tracking'
  /driver/location:
    $ref: './api/fr03_tracking.yaml#/paths/~1driver~1location'
  
  /driver/rides/{rideId}/accept:
    $ref: './api/fr02_dispatch.yaml#/paths/~1driver~1rides~1{rideId}~1accept'
  /driver/rides/{rideId}/reject:
    $ref: './api/fr02_dispatch.yaml#/paths/~1driver~1rides~1{rideId}~1reject'

  # Module Trip Lifecycle (Tài xế cập nhật trạng thái)
  /driver/rides/{rideId}/status:
    $ref: './api/fr04_trip_lifecycle.yaml#/paths/~1driver~1rides~1{rideId}~1status'

  # Module Payment (Thanh toán)
  /rides/{rideId}/payment:
    $ref: './api/fr05_payment.yaml#/paths/~1rides~1{rideId}~1payment'
  /payments/callback:
    $ref: './api/fr05_payment.yaml#/paths/~1payments~1callback'

  # Module Rating (Đánh giá)
  /rides/{rideId}/rating:
    $ref: './api/fr06_rating.yaml#/paths/~1rides~1{rideId}~1rating'

# --- KHAI BÁO CÁC SCHEMA (DỮ LIỆU) DÙNG CHUNG ---
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RideId:
      name: rideId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    RegisterRequest:
      type: object
      required: [phone, password, role]
      properties:
        phone:
          type: string
        password:
          type: string
          format: password
        role:
          type: string
          enum: [customer, driver]

    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer

    CreateRideRequest:
      type: object
      required: [pickup_location, destination_location, vehicle_type, payment_method]
      properties:
        pickup_location:
          $ref: '#/components/schemas/Location'
        destination_location:
          $ref: '#/components/schemas/Location'
        vehicle_type:
          type: string
          enum: [car_4, car_7]
        payment_method:
          type: string
          enum: [cash, momo, vnpay]

    Ride:
      type: object
      properties:
        ride_id:
          type: integer
        status:
          type: string
          enum: [SEARCHING_DRIVER, DRIVER_ASSIGNED, DRIVER_ARRIVED, PICKED_UP, IN_PROGRESS, COMPLETED, CANCELLED, DRIVER_NOT_FOUND]
        estimated_fare:
          type: number
        estimated_distance_km:
          type: number
        estimated_time_min:
          type: integer
        driver:
          $ref: '#/components/schemas/Driver'

    Driver:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        vehicle_plate:
          type: string
        vehicle_type:
          type: string

    TrackingResponse:
      type: object
      properties:
        status:
          type: string
        eta_min:
          type: integer
        driver_location:
          $ref: '#/components/schemas/Location'

    Location:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double

    CancelRideRequest:
      type: object
      properties:
        reason:
          type: string

    RejectRideRequest:
      type: object
      properties:
        reason:
          type: string

    StatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [DRIVER_ARRIVED, PICKED_UP, IN_PROGRESS, COMPLETED]

    PaymentRequest:
      type: object
      required: [payment_method]
      properties:
        payment_method:
          type: string
          enum: [cash, momo, vnpay]

    PaymentResponse:
      type: object
      properties:
        payment_id:
          type: integer
        payment_url:
          type: string
        payment_status:
          type: string
          enum: [PENDING, SUCCESS, FAILED]

    PaymentCallback:
      type: object
      properties:
        payment_id:
          type: integer
        transaction_id:
          type: string
        status:
          type: string

    RatingRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    Error:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
